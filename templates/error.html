{% extends 'base.html' %}
{% block title %} Error {% endblock %}
{% block body %}
<div class="container text-center text-white" style="padding-top: 10%;">
  <h1 class="display-4 mb-4">⚠️ Error</h1>
  <p class="lead mb-4">{{ message if message else "Something went wrong" }}</p>
  <a href="/" class="btn btn-light btn-lg mt-3">Go Home</a>
  {% if 'access_token' in session %}
  <a href="/playlists" class="btn btn-outline-light btn-lg mt-3 ms-2">My Playlists</a>
  {% endif %}
</div>
{% endblock %}
